<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sealed Shrine (draft) — v0.2 M2</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0b0a12; color: #e8e4d8;
        font-family: "Courier New", monospace;
        overflow: hidden;
      }
      #wrap {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0b0a12;
      }
      #frame { position: relative; }
      canvas { display: block; image-rendering: pixelated; background: #060510; }
      #hint {
        position: fixed; left: 8px; bottom: 6px;
        font-size: 11px; color: #8d88a0; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="frame"></div></div>
    <div id="hint">Arrows move · Z shot/confirm · X bomb/back · Shift focus · Esc pause · M mute</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
